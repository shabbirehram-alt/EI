name: raabta-voice
on:
  push:
    branches: [raabta-voice]
    paths: ['raabta/lines.json', 'raabta/gen.py']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install edge-tts
      - run: python raabta/gen.py
      - name: music
        continue-on-error: true
        run: |
          mkdir -p raabta/music
          for n in Inspired Wholesome Carefree "Healing" "Dreamer" "Easy%20Lemon" "Life%20of%20Riley"; do
            curl -sfL -o "raabta/music/$(echo $n | sed 's/%20/_/g').mp3" "https://incompetech.com/music/royalty-free/mp3-royaltyfree/$n.mp3" || true
          done
          ls -la raabta/music
      - run: |
          git config user.name "raabta-bot"; git config user.email "raabta-bot@users.noreply.github.com"
          git add raabta/vo raabta/music
          git commit -m "Generate Raabta Urdu voiceover"
          git push
